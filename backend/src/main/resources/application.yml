spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:receitas_culinarias}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:adminpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true