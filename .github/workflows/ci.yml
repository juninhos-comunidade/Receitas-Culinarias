name: Full Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  # ---------------------------------------------------
  # Responsável pelo Back-end (Java/Spring)
  # ---------------------------------------------------
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build and Test with Maven
        run: mvn -B clean verify

  # ---------------------------------------------------
  # Responsável pelo Front-end (React/Next.js)
  # ---------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: ./frontend
        run: npm ci

      - name: Run Linting
        if: hashFiles('frontend/package.json') != ''
        working-directory: ./frontend
        run: npm run lint

      - name: Run Tests
        if: hashFiles('frontend/package.json') != ''
        working-directory: ./frontend
        run: npm test

      - name: Build Next.js project
        if: hashFiles('frontend/package.json') != ''
        working-directory: ./frontend
        run: npm run build
        
      - name: Skip message
        if: hashFiles('frontend/package.json') == ''
        run: echo "Nenhum arquivo do frontend encontrado. Skippando com sucesso!"

  # ---------------------------------------------------
  # Responsável pelo Docker (Empacotamento)
  # ---------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest

    needs: backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test Docker image build
        if: hashFiles('Dockerfile') != ''
        run: docker build -t receitas-api:test .
        
      - name: Skip message
        if: hashFiles('Dockerfile') == ''
        run: echo "Nenhum Dockerfile encontrado. Skippando com sucesso!"