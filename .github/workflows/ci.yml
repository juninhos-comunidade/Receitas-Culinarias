name: Full Stack CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  # ---------------------------------------------------
  # ROBÔ 1: Responsável pelo Back-end (Java/Spring)
  # ---------------------------------------------------
  backend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test with Maven
        run: mvn -B clean verify

  # ---------------------------------------------------
  # ROBÔ 2: Responsável pelo Front-end (React/Next.js)
  # ---------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Lembrete: Descomentar as linhas abaixo depois de configurar os testes
      # - name: Run Linting
      #   run: npm run lint

      # - name: Run Tests
      #   run: npm test

      - name: Build Next.js project
        run: npm run build

  # ---------------------------------------------------
  # ROBÔ 3: Responsável pelo Docker (Empacotamento)
  # ---------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest

    needs: backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Docker image build
        run: docker build -t receitas-api:test .